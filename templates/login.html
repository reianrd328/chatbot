<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lyrch AI | Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="background"></div>

<div class="login-container">

    <div class="logo">

        ✦

    </div>

    <h1>Lyrch <span>AI</span></h1>

    <p class="subtitle">

        Think Clearly. Create Confidently.

    </p>

    {% with messages = get_flashed_messages() %}
    {% if messages %}

        {% for message in messages %}

            <div class="alert">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}
    {% endwith %}

    <form method="POST">

        <div class="input-group">

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required>

        </div>

        <div class="input-group">

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

        </div>

        <button type="submit">

            Sign In

        </button>

    </form>

    <div class="footer">

        Don't have an account?

        <a href="{{ url_for('auth.register') }}">

            Create Account

        </a>

    </div>

</div>

</body>

</html>
